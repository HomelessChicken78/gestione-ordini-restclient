services:
  db:
    image: mysql:8.0.45
    container_name: mysql-container
    ports:
      - "3307:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    networks:
      - ordini-pagamenti

  amq-broker:
    image: rabbitmq:3-management
    container_name: rabbit-mq-container
    hostname: my-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ordini-pagamenti

  gateway:
    build: ../ordini-e-pagamenti-gateway
    image: homelesschicken/ordini-e-pagamenti-gateway:0.0.2
    container_name: ordini-pagamenti-gateway-container
    ports:
      - "8080:8080"
    environment:
      - GESTIONE_ORDINI_HOST=gestione-ordini-container
      - PATH_ORDINI=api/ordini
      - GESTIONE_PAGAMENTI_HOST=gestione-pagamenti-container
      - PATH_PAGAMENTI=api/pagamenti
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - ordini-pagamenti
    depends_on:
      ordini:
        # Con questo diciamo a docker: avvia questo container SOLO dopo che sei sicuro che il container del servizio
        # degli ordini sia "healthy" ovvero, nel nostro caso, dopo che il comando curl sia andato a buon fine.
        # Se non lo mettessimo diremo a docker di avviare il gateway un istante (letteralmente pochissimi milllisecondi)
        # dopo aver avviato gli ordini, fregandosene dell'esito.
        condition: service_healthy
      pagamenti:
        condition: service_healthy

  auth:
    build: ../ordini-e-pagamenti-auth
    image: homelesschicken/ordini-e-pagamenti-auth:0.0.1
    container_name: ordini-pagamenti-auth-container
    ports:
      - "8083:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-container:3306/ordini_e_pagamenti_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION_MILLIS=300000
    networks:
      - ordini-pagamenti
    depends_on:
      - db

  ordini:
    build: .
    image: homelesschicken/gestione-ordini:0.0.2
    container_name: gestione-ordini-container
    ports:
      - "8081:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-container:3306/gestione_ordini
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PAGAMENTO_URL=http://gestione-pagamenti-container:8080/api
      - RABBITMQ_HOST=rabbit-mq-container
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - ordini-pagamenti
    depends_on:
      - db
      - amq-broker
    # Healthcheck: quando il container viene tirato su, esegui questo comando all'interno del container stesso, per vedere
    # che stia funzionando correttamente.
    # NOTARE: Siccome siamo all'interno del container, possiamo usare la sua porta interna (8080) e non c'è bisogno
    # ne di usare il DNS di docker ne di usare la porta mappata sul pc.
    healthcheck:
      # Usa curl. Curl è un programma da terminale per fare chiamate http, come postman. Il -f significa "dammi un errore
      # se mi ritorna uno status code diverso da 2XX. In questo modo docker vede l'errore e capisce che è andato male il tentativo
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ordini/health"]
      # Esegui un tentativo (un comando) ogni 10 secondi
      interval: 10s
      # Il tentativo corrente è andato male se ci mette più di 5 secondi (per esempio il microservizio è spento e dunque non risponde)
      timeout: 5s
      # Massimo 5 tentativi. Dopodichè accettiamo che il container non sia "in salute"
      retries: 5

  pagamenti:
    build: ../gestione-pagamenti-restclient
    image: homelesschicken/gestione-pagamenti:0.0.3
    container_name: gestione-pagamenti-container
    ports:
      - "8082:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-container:3306/gestione_ordini
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_HOST=rabbit-mq-container
    networks:
      - ordini-pagamenti
    depends_on:
      - db
      - amq-broker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/pagamenti/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ordini-pagamenti:

volumes:
  mysql_volume:
    external: true
    name: mysql_volume