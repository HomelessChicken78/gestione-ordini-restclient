services:
  db:
    image: mysql:8.0.45
    container_name: mysql-container
    ports:
      - "3307:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    networks:
      - ordini-pagamenti

  amq-broker:
    image: rabbitmq:3-management
    container_name: rabbit-mq-container
    hostname: my-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ordini-pagamenti

  ordini:
    image: homelesschicken/gestione-ordini:0.0.1
    container_name: gestione-ordini-container
    ports:
      - "8081:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-container:3306/gestione_ordini
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PAGAMENTO_URL=http://gestione-pagamenti-container:8080/api
      - RABBITMQ_HOST=rabbit-mq-container
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - ordini-pagamenti
    depends_on:
      - db
      - amq-broker

  pagamenti:
    image: homelesschicken/gestione-pagamenti:0.0.2
    container_name: gestione-pagamenti-container
    ports:
      - "8082:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-container:3306/gestione_ordini
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_HOST=rabbit-mq-container
    networks:
      - ordini-pagamenti
    depends_on:
      - db
      - amq-broker

networks:
  ordini-pagamenti:

volumes:
  mysql_volume:
    external: true
    name: mysql_volume